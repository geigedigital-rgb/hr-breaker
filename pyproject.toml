[project]
name = "hr-breaker"
version = "0.1.0"
description = "Resume optimization tool for job postings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Boris Tseitlin"}]
license = {text = "MIT"}
keywords = ["resume", "job", "optimization", "ats", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Production API deps only. Heavy / unused-at-runtime packages live in optional-dependencies
# so Docker `pip install '.[db]'` does not explode (pip resolution-too-deep).
dependencies = [
    "fastapi>=0.115,<1",
    "passlib[bcrypt]>=1.7,<2",
    "pyjwt[crypto]>=2.8,<3",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.0,<3",
    # Slim Google-only agent stack (full `pydantic-ai` pulls every provider + MCP/temporal/…)
    "pydantic-ai-slim[google]>=1.48,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "scikit-learn>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "click>=8.0,<9",
    "pymupdf>=1.24,<2",
    "python-docx>=1.0,<2",
    "importlib-metadata>=6.0,<8.0",
    "weasyprint>=60.0,<71",
    "jinja2>=3.1,<4",
    "watchdog>=6.0.0,<7",
    "nest-asyncio>=1.6.0,<2",
    "playwright>=1.40,<2",
    "stripe>=11.0,<16",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
hr-breaker = "hr_breaker.cli:cli"
hr-breaker-api = "hr_breaker.api:run_api"

[project.urls]
Homepage = "https://github.com/btseytlin/hr-breaker"
Repository = "https://github.com/btseytlin/hr-breaker"
Issues = "https://github.com/btseytlin/hr-breaker/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]
stealth = [
    "playwright-stealth>=2.0",
]
apify = [
    "apify-client>=1.0",
]
db = [
    "asyncpg>=0.29,<1",
]
auth = [
    "passlib[bcrypt]>=1.7",
    "pyjwt[crypto]>=2.8",
]
# Local Streamlit UI (not used by Docker API image)
ui = [
    "streamlit>=1.30,<2",
]
# Optional vector / NLP filters (lazy-imported; not required for /analyze|/optimize)
vector = [
    "sentence-transformers>=2.0,<4",
    "qdrant-client>=1.7,<2",
]
nlp = [
    "spacy>=3.0,<4",
]
# Legacy Google SDK if needed outside pydantic-ai
google-legacy = [
    "google-generativeai>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_breaker"]
# templates/ inside hr_breaker are included automatically with the package tree

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
